<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Scheduler - Conservatory</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600;700&display=swap');

  :root {
    --accent: #0078d4;
    --muted: #f3f3f3;
    --card: #ffffff;
    --text: #222;
    --danger: #ff4c4c;
    --ok: #28a745;
    --bg-overlay: rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; font-family: "Segoe UI", system-ui, sans-serif; }
  body { margin: 0; background: #f5f6f8; padding: 20px; display: flex; justify-content: center; }

  .wrap { width: 100%; max-width: 1200px; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
  
  .title h1 { font-size: 18px; margin: 0; color: var(--text); line-height: 1.4; }
  .controls { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .branch-info { font-weight: 700; color: #333; text-align: right; font-size: 14px; }
  
  .btn { background: var(--accent); border: none; color: #fff; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
  .btn:hover { opacity: 0.9; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: var(--danger); }

  .calendar { background: var(--card); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); overflow: hidden; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: var(--accent); color: #fff; }
  
  .nav { display: flex; gap: 10px; }
  .nav .icon { background: rgba(255,255,255,0.2); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  .grid { display: grid; grid-template-columns: 80px repeat(7, 1fr); background: #eee; gap: 1px; }
  .cell { background: #fff; padding: 8px; min-height: 50px; }
  
  .day-header { background: var(--muted); text-align: center; font-weight: 700; display: flex; flex-direction: column; gap: 4px; padding: 12px 5px; }
  .day-date { font-weight: 400; font-size: 11px; color: #666; }
  
  .link-btn { margin-top: 5px; font-size: 10px; padding: 4px; cursor: pointer; border-radius: 4px; border: 1px solid #ddd; background: #fff; }
  .link-btn.linked { background: #e6f7ff; border-color: var(--accent); color: var(--accent); }

  .time-label { background: var(--muted); font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; }
  .slot { cursor: pointer; transition: background 0.1s; position: relative; }
  .slot:hover { background: #f9f9f9; }

  .event { display: block; padding: 5px 8px; border-radius: 4px; margin-bottom: 4px; font-size: 12px; background: #e3f2fd; border-left: 3px solid var(--accent); color: #111; word-break: break-word; }
  .event.absent { background: #ffebee; border-left-color: var(--danger); text-decoration: line-through; opacity: 0.8; }

  /* Dialog */
  .dialog-back { position: fixed; inset: 0; background: var(--bg-overlay); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .dialog { background: #fff; padding: 25px; border-radius: 12px; width: 350px; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
  .form-row { margin-bottom: 15px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
  input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ddd; outline: none; }
  
  .switch-row { display: flex; align-items: center; gap: 10px; background: #f8f8f8; padding: 8px; border-radius: 6px; }
  .switch { position: relative; width: 40px; height: 20px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; cursor: pointer; inset: 0; background: #ccc; transition: .3s; border-radius: 20px; }
  .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background: white; transition: .3s; border-radius: 50%; }
  input:checked + .slider { background: var(--danger); }
  input:checked + .slider:before { transform: translateX(20px); }

  @media (max-width: 900px) {
    .grid { grid-template-columns: 60px repeat(7, 120px); overflow-x: auto; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="title">
      <h1>The Lebanese National High Conservatory Of Music<br>Academic Year: 2025 - 2026</h1>
    </div>
    <div class="controls">
      <div class="branch-info">Piano Professor: Ghada Nahouli<br>Branch: Saida</div>
      <div style="display:flex; gap:6px;">
        <button class="btn danger" id="clearStorage">Clear All</button>
        <button class="btn secondary" id="downloadJson">Download JSON</button>
        <button class="btn" id="uploadJson">Upload JSON</button>
        <input type="file" id="fileInput" accept=".json" style="display:none;">
      </div>
    </div>
  </div>

  <div class="calendar">
    <div class="header">
      <div class="week-range" id="weekRange">---</div>
      <div class="nav">
        <div class="icon" id="prevWeek">◀</div>
        <div class="icon" id="nextWeek">▶</div>
      </div>
    </div>
    <div class="grid" id="calendarGrid"></div>
  </div>
</div>

<div id="dialogContainer" style="display: none;"></div>

<script>
const grid = document.getElementById('calendarGrid');
const weekRange = document.getElementById('weekRange');
const dialogContainer = document.getElementById('dialogContainer');

let currentDate = new Date();
const startHour = 9, endHour = 18, slotStep = 30;

// Keys
const EV_KEY = 'studentEvents_v_local_v2';
const TMP_KEY = 'weekdayTemplates_v_local_v2';
const LINK_KEY = 'linkedWeekdays_v_local_v2';
const LAST_BACKUP_KEY = 'last_backup_date';

let events = JSON.parse(localStorage.getItem(EV_KEY)) || {};
let templates = JSON.parse(localStorage.getItem(TMP_KEY)) || {};
let linkedWeekdays = JSON.parse(localStorage.getItem(LINK_KEY)) || {};

function saveAll() {
  localStorage.setItem(EV_KEY, JSON.stringify(events));
  localStorage.setItem(TMP_KEY, JSON.stringify(templates));
  localStorage.setItem(LINK_KEY, JSON.stringify(linkedWeekdays));
  console.log("Auto-saved to storage");
}

// 1 Second Auto-Save
setInterval(saveAll, 1000);

// 7-Day Backup Logic
function checkBackupStatus() {
  const lastBackup = localStorage.getItem(LAST_BACKUP_KEY);
  const now = new Date().getTime();
  const sevenDays = 7 * 24 * 60 * 60 * 1000;

  if (!lastBackup || (now - lastBackup) > sevenDays) {
    setTimeout(() => {
      alert("Notice: It has been 7 days since your last manual backup. We will now download your data.");
      downloadData();
    }, 2000);
  }
}

function downloadData() {
  const data = { events, templates, linkedWeekdays };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `conservatory-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  localStorage.setItem(LAST_BACKUP_KEY, new Date().getTime().toString());
}

document.getElementById('downloadJson').onclick = downloadData;

document.getElementById('uploadJson').onclick = () => document.getElementById('fileInput').click();
document.getElementById('fileInput').onchange = e => {
  const file = e.target.files[0];
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const data = JSON.parse(evt.target.result);
      events = data.events || {}; templates = data.templates || {}; linkedWeekdays = data.linkedWeekdays || {};
      saveAll(); renderCalendar(currentDate);
      alert('Data imported!');
    } catch(err) { alert('Invalid file'); }
  };
  reader.readAsText(file);
};

function isoDate(d) { return d.toISOString().split('T')[0]; }
function formatTimeAMPM(h, m) {
  const ampm = h >= 12 ? 'PM' : 'AM';
  const hr = h > 12 ? h - 12 : (h === 0 ? 12 : h);
  return `${hr}:${m.toString().padStart(2, '0')} ${ampm}`;
}

function getWeekStart(date) {
  const d = new Date(date);
  const diff = d.getDay() === 0 ? -6 : 1 - d.getDay();
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}

function renderCalendar(date) {
  grid.innerHTML = '';
  const startOfWeek = getWeekStart(date);
  const days = [];
  for (let i = 0; i < 7; i++) {
    const dd = new Date(startOfWeek);
    dd.setDate(dd.getDate() + i);
    days.push(dd);
  }

  // Top Left empty cell
  const tl = document.createElement('div'); tl.className = 'cell day-header';
  grid.appendChild(tl);

  // Headers
  days.forEach(d => {
    const wkIdx = d.getDay();
    const isLinked = linkedWeekdays[wkIdx];
    const cell = document.createElement('div');
    cell.className = 'cell day-header';
    cell.innerHTML = `
      <div class="day-name">${d.toLocaleDateString(undefined, { weekday: 'short' })}</div>
      <div class="day-date">${d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>
      <button class="link-btn ${isLinked ? 'linked' : ''}" onclick="toggleLink(${wkIdx}, '${isoDate(d)}')">
        ${isLinked ? '🔗 Linked' : 'Link Week'}
      </button>
    `;
    grid.appendChild(cell);
  });

  // Time Slots
  for (let h = startHour; h <= endHour; h++) {
    for (let m = 0; m < 60; m += slotStep) {
      const timeKey = formatTimeAMPM(h, m);
      const tlbl = document.createElement('div');
      tlbl.className = 'cell time-label';
      tlbl.textContent = timeKey;
      grid.appendChild(tlbl);

      days.forEach(d => {
        const dKey = isoDate(d);
        const fullKey = `${dKey}-${timeKey}`;
        const wkIdx = d.getDay();
        const slot = document.createElement('div');
        slot.className = 'cell slot';
        
        // Ensure event array exists
        if (!events[fullKey]) events[fullKey] = [];

        // Logic for linked templates
        let displayList = [...events[fullKey]];
        if (linkedWeekdays[wkIdx] && templates[wkIdx]?.[timeKey]) {
          templates[wkIdx][timeKey].forEach(tpl => {
            if (!displayList.find(e => e.student === tpl.student)) {
              displayList.push({ ...tpl, note: '', absent: false });
            }
          });
          // Update the actual events object to include template items
          events[fullKey] = displayList;
        }

        displayList.forEach((ev, idx) => {
          const el = document.createElement('span');
          el.className = `event ${ev.absent ? 'absent' : ''}`;
          el.innerHTML = `<strong>${ev.student}</strong> ${ev.grade ? '['+ev.grade+']' : ''}<br><small>${ev.note || ''}</small>`;
          el.onclick = (e) => { e.stopPropagation(); openEditDialog(dKey, timeKey, idx); };
          slot.appendChild(el);
        });

        slot.onclick = () => openAddDialog(dKey, timeKey);
        grid.appendChild(slot);
      });
    }
  }

  weekRange.textContent = `${days[0].toLocaleDateString(undefined, {month:'short', day:'numeric'})} — ${days[6].toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})}`;
}

function toggleLink(idx, dateStr) {
  if (linkedWeekdays[idx]) {
    delete linkedWeekdays[idx];
    delete templates[idx];
  } else {
    linkedWeekdays[idx] = true;
    templates[idx] = {};
    // Grab all events from this specific date to create template
    for (let h = startHour; h <= endHour; h++) {
      for (let m = 0; m < 60; m += slotStep) {
        const tk = formatTimeAMPM(h, m);
        const fk = `${dateStr}-${tk}`;
        if (events[fk]?.length) {
          templates[idx][tk] = events[fk].map(e => ({ student: e.student, grade: e.grade }));
        }
      }
    }
  }
  renderCalendar(currentDate);
}

function openAddDialog(dKey, tKey) {
  showDialog(`Add Student - ${tKey}`, (data) => {
    events[`${dKey}-${tKey}`].push(data);
    renderCalendar(currentDate);
  });
}

function openEditDialog(dKey, tKey, idx) {
  const ev = events[`${dKey}-${tKey}`][idx];
  showDialog(`Edit - ${tKey}`, (data) => {
    events[`${dKey}-${tKey}`][idx] = data;
    renderCalendar(currentDate);
  }, () => {
    events[`${dKey}-${tKey}`].splice(idx, 1);
    renderCalendar(currentDate);
  }, ev);
}

function showDialog(title, onSave, onDelete, existingData = {}) {
  dialogContainer.style.display = 'flex';
  dialogContainer.className = 'dialog-back';
  dialogContainer.innerHTML = `
    <div class="dialog">
      <h3 style="margin:0 0 15px 0">${title}</h3>
      <div class="form-row">
        <label>Student Name</label>
        <input type="text" id="f_student" value="${existingData.student || ''}">
      </div>
      <div class="form-row">
        <label>Grade / Level</label>
        <input type="text" id="f_grade" value="${existingData.grade || ''}">
      </div>
      <div class="form-row">
        <div class="switch-row">
          <label class="switch">
            <input type="checkbox" id="f_absent" ${existingData.absent ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
          <span>Mark as Absent</span>
        </div>
      </div>
      <div class="form-row">
        <label>Notes</label>
        <textarea id="f_note">${existingData.note || ''}</textarea>
      </div>
      <div style="display:flex; justify-content: space-between;">
        <div>
          ${onDelete ? '<button class="btn danger" id="f_del">Delete</button>' : ''}
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn secondary" onclick="closeDialog()">Cancel</button>
          <button class="btn" id="f_save">Save</button>
        </div>
      </div>
    </div>
  `;

  document.getElementById('f_save').onclick = () => {
    const student = document.getElementById('f_student').value;
    if (!student) return alert("Name required");
    onSave({
      student,
      grade: document.getElementById('f_grade').value,
      absent: document.getElementById('f_absent').checked,
      note: document.getElementById('f_note').value
    });
    closeDialog();
  };

  if (onDelete) document.getElementById('f_del').onclick = () => { onDelete(); closeDialog(); };
}

function closeDialog() { dialogContainer.style.display = 'none'; }

document.getElementById('prevWeek').onclick = () => { currentDate.setDate(currentDate.getDate() - 7); renderCalendar(currentDate); };
document.getElementById('nextWeek').onclick = () => { currentDate.setDate(currentDate.getDate() + 7); renderCalendar(currentDate); };

document.getElementById('clearStorage').onclick = () => {
  if (confirm("Permanently delete ALL data?")) {
    localStorage.clear();
    location.reload();
  }
};

// Start
renderCalendar(currentDate);
checkBackupStatus();
</script>

</body>
</html>
