<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Scheduler</title>

<style>
:root{
  --accent:#0078d4;
  --muted:#f3f3f3;
  --card:#fff;
  --text:#222;
  --danger:#ff4c4c;
  --ok:#28a745;
}
*{box-sizing:border-box;font-family:Segoe UI,system-ui}
body{margin:0;background:#f4f5f7;padding:24px;display:flex;justify-content:center}
.wrap{width:100%;max-width:1150px}
.calendar{background:#fff;border-radius:12px;box-shadow:0 6px 22px rgba(0,0,0,.08);overflow:hidden}
.header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(90deg,#0078d4,#006bb3);color:#fff}
.grid{display:grid;grid-template-columns:80px repeat(7,1fr)}
.cell{border:1px solid #eee;padding:6px;font-size:12px}
.day-header{background:#f3f3f3;text-align:center;font-weight:600}
.time-label{background:#f3f3f3;text-align:center}
.slot{min-height:46px;cursor:pointer}
.event{background:#e6f7ff;padding:4px;border-radius:6px;margin-bottom:4px;white-space:pre-line}
.event.absent{background:#ffd6d6}
button{cursor:pointer}
.btn{background:#0078d4;color:#fff;border:none;padding:6px 10px;border-radius:6px}
.btn.secondary{background:#fff;color:#0078d4;border:1px solid #ddd}
.dialog-back{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.dialog{background:#fff;padding:20px;border-radius:10px;min-width:300px}
input,textarea{width:100%;margin:6px 0;padding:6px}
</style>
</head>

<body>
<div class="wrap">
  <div class="calendar">
    <div class="header">
      <div id="weekRange"></div>
      <div>
        <button class="btn secondary" id="prev">◀</button>
        <button class="btn secondary" id="next">▶</button>
        <button class="btn secondary" id="clear">Clear</button>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="dialog"></div>

<script>
/* ================= STORAGE ================= */
const STORAGE_KEY = "student_scheduler_v3";

let state = {
  currentDate: new Date().toISOString(),
  events: {},          // { "YYYY-MM-DD|HH:MM": [ {...} ] }
  templates: {},       // weekday -> time -> students
  linked: {}            // weekday -> true
};

const saved = localStorage.getItem(STORAGE_KEY);
if(saved) state = JSON.parse(saved);

function persist(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}
window.addEventListener("beforeunload", persist);

/* ================= HELPERS ================= */
const grid = document.getElementById("grid");
const weekRange = document.getElementById("weekRange");
const dialog = document.getElementById("dialog");

const startHour = 9, endHour = 18, step = 30;

function iso(d){
  return d.toISOString().split("T")[0];
}
function timeLabel(h,m){
  const a=h>=12?"PM":"AM";
  const hr=h>12?h-12:(h||12);
  return `${hr}:${m.toString().padStart(2,"0")} ${a}`;
}
function weekStart(d){
  const n=new Date(d);
  const diff=n.getDay()===0?-6:1-n.getDay();
  n.setDate(n.getDate()+diff);
  n.setHours(0,0,0,0);
  return n;
}

/* ================= RENDER ================= */
function render(){
  grid.innerHTML="";
  const base = weekStart(new Date(state.currentDate));
  const days=[...Array(7)].map((_,i)=>new Date(base.getTime()+i*86400000));

  grid.appendChild(Object.assign(document.createElement("div"),{className:"cell"}));

  days.forEach(d=>{
    const c=document.createElement("div");
    c.className="cell day-header";
    c.innerHTML=d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
    grid.appendChild(c);
  });

  for(let h=startHour;h<=endHour;h++){
    for(let m=0;m<60;m+=step){
      const t=timeLabel(h,m);
      grid.appendChild(Object.assign(document.createElement("div"),{
        className:"cell time-label",textContent:t
      }));

      days.forEach(d=>{
        const slot=document.createElement("div");
        slot.className="cell slot";
        const key=iso(d)+"|"+t;
        state.events[key]=state.events[key]||[];

        state.events[key].forEach((ev,i)=>{
          const e=document.createElement("div");
          e.className="event"+(ev.absent?" absent":"");
          e.textContent=ev.student+(ev.grade?" · "+ev.grade:"")+(ev.note?"\n"+ev.note:"");
          e.onclick=x=>{x.stopPropagation();editEvent(key,i)};
          slot.appendChild(e);
        });

        slot.onclick=()=>addEvent(key);
        grid.appendChild(slot);
      });
    }
  }

  weekRange.textContent =
    days[0].toLocaleDateString(undefined,{month:"short",day:"numeric"})+
    " — "+
    days[6].toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});

  persist();
}

/* ================= DIALOGS ================= */
function addEvent(key){
  showDialog("Add Event",{},data=>{
    state.events[key].push(data);
    render();
  });
}

function editEvent(key,index){
  showDialog("Edit Event",state.events[key][index],data=>{
    state.events[key][index]=data;
    render();
  },()=>{
    state.events[key].splice(index,1);
    render();
  });
}

function showDialog(title,data,onSave,onDelete){
  dialog.innerHTML=`
  <div class="dialog-back">
    <div class="dialog">
      <h3>${title}</h3>
      <input placeholder="Student" id="s" value="${data.student||""}">
      <input placeholder="Grade" id="g" value="${data.grade||""}">
      <textarea placeholder="Note" id="n">${data.note||""}</textarea>
      <label><input type="checkbox" id="a" ${data.absent?"checked":""}> Absent</label>
      <div style="margin-top:10px;text-align:right">
        ${onDelete?'<button class="btn secondary" id="del">Delete</button>':""}
        <button class="btn" id="save">Save</button>
      </div>
    </div>
  </div>`;
  document.getElementById("save").onclick=()=>{
    onSave({
      student:s.value.trim(),
      grade:g.value.trim(),
      note:n.value.trim(),
      absent:a.checked
    });
    dialog.innerHTML="";
  };
  if(onDelete) document.getElementById("del").onclick=()=>{
    onDelete();
    dialog.innerHTML="";
  };
}

/* ================= NAV ================= */
document.getElementById("prev").onclick=()=>{
  const d=new Date(state.currentDate);
  d.setDate(d.getDate()-7);
  state.currentDate=d.toISOString();
  render();
};
document.getElementById("next").onclick=()=>{
  const d=new Date(state.currentDate);
  d.setDate(d.getDate()+7);
  state.currentDate=d.toISOString();
  render();
};
document.getElementById("clear").onclick=()=>{
  if(confirm("Clear all data?")){
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }
};

render();
</script>
</body>
</html>
